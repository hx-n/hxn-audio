[package]
name = "hxn-audio"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hx-n/hxn-audio"
description = "Native audio output, voices, streaming PCM, buses and effects for Haxe"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
hxn-audio-core = { path = "crates/hxn-audio-core" }
rtrb = "0.4.1"

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.9" }
hxn-audio-core.workspace = true
rtrb.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cpal = "0.18.2"

[package.metadata.hxn]
library = "audio"
haxelib = "hxn-audio"
contributors = ["darmie"]
releasenote = "Use hxn 0.3.9 shared logging with application-owned filtering and sinks; retain pinned dependency redistribution notices."
haxe = "examples/check"
init = ["hxn.audio.Init.register()"]

[package.metadata.hxn.cli]
version = 1
namespace = "audio"
command = ["haxe", "-cp", "{root}/sources", "--run", "hxn.audio.cli.Tool"]
hooks = ["before-build", "before-package"]
files = ["assets/hxn_audio_dsp.wasm", "third-party"]

[build-dependencies]
cc = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
cpal = { version = "0.18.2", features = ["realtime"] }
