name: Generated API
on:
  push:
    branches: [main]
  pull_request:
defaults:
  run:
    shell: bash
jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { runtime: package }
      - run: hxn package hl cpp --release --out .
      - run: |
          changed="$(git status --porcelain --untracked-files=all -- binding include page haxelib.json extraParams.hxml audio.hxn.json)"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff
            echo "::error::generated API files differ from source"
            exit 1
          fi
